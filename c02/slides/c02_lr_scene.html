<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The weight table</title>
<!-- Standalone scene for class 2: how logistic regression learns its weights and uses them, with the class 1
     notebook's code (c01_bow_lr.ipynb, cell 13, shortened) beside the picture; each step lights the line that does it.
     Ten steps, one key press each (→ or click: next, ←: back, P: play all). Data: c02_lr_scene_data.js, built by
     c02_lr_scene_build.py. D3 from the theme; the Carbon tokens; the deck's 1280 x 720 canvas, so the scene drops
     into the deck in an iframe with ?embed (the deck drives it by postMessage). -->
<style>
@font-face { font-family: "IBM Plex Sans"; font-weight: 300; font-display: block; src: local("IBM Plex Sans Light"), url("../../theme/fonts/IBMPlexSans-Light.otf") format("opentype"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 400; font-display: block; src: local("IBM Plex Sans"), url("../../theme/fonts/IBMPlexSans-Regular.otf") format("opentype"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 600; font-display: block; src: local("IBM Plex Sans SemiBold"), url("../../theme/fonts/IBMPlexSans-SemiBold.otf") format("opentype"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-display: block; src: local("IBM Plex Mono"), url("../../theme/fonts/IBMPlexMono-Regular.otf") format("opentype"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: block; src: local("IBM Plex Mono SemiBold"), url("../../theme/fonts/IBMPlexMono-SemiBold.otf") format("opentype"); }
:root {
  --bg: #FFFFFF; --layer: #F4F4F4; --border: #E0E0E0; --border-strong: #8D8D8D;
  --text: #161616; --text-2: #525252; --helper: #6F6F6F; --placeholder: #A8A8A8;
  --blue: #0F62FE; --blue-10: #EDF5FF; --red: #DA1E28; --quiet: #C6C6C6;
  --kw: #6929C4; --fn: #0F62FE; --nm: #007D79;
  --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; --mono: "IBM Plex Mono", Menlo, monospace;
  --bangla: "Kohinoor Bangla", "Noto Sans Bengali", "Bangla Sangam MN", sans-serif;
  --ease: cubic-bezier(0.4, 0.14, 0.3, 1);
}
html, body { margin: 0; height: 100%; background: #262626; overflow: hidden; }
body { position: relative; font-family: var(--sans); color: var(--text); }
#stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; background: var(--bg); overflow: hidden; transform-origin: center; }
#stage * { box-sizing: border-box; }
#stage.instant *, #stage.instant *::before, #stage.instant *::after { transition: none !important; }
#title { position: absolute; left: 64px; top: 44px; margin: 0; font-size: 42px; line-height: 50px; font-weight: 300; }
#sub { position: absolute; left: 64px; top: 102px; width: 1152px; font-size: 20px; line-height: 28px; color: var(--text-2); }
#sub b { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
#caption { position: absolute; left: 64px; bottom: 28px; width: 720px; font-size: 14px; line-height: 20px; color: var(--helper); }
#stepno { position: absolute; right: 64px; bottom: 28px; font-size: 14px; line-height: 20px; color: var(--placeholder); font-variant-numeric: tabular-nums; }
#play { position: absolute; right: 124px; bottom: 24px; font: 14px/20px var(--sans); color: var(--helper); background: none; border: 1px solid var(--border); padding: 3px 10px; cursor: pointer; }
.layer { position: absolute; left: 64px; top: 150px; width: 1152px; height: 490px; }
#fig { position: absolute; left: 0; top: 0; }
/* the article card: one small line (what it is, and the loss), one line of text */
#card { position: absolute; left: 164px; top: 0; width: 552px; height: 48px; padding: 4px 0 0 12px; border-left: 3px solid var(--border-strong); opacity: 0; transition: opacity 300ms var(--ease), border-color 300ms; }
#card small { display: flex; justify-content: space-between; font-size: 13px; line-height: 18px; color: var(--helper); }
#card small .loss { font-family: var(--mono); font-size: 13px; color: var(--text); opacity: 0; transition: opacity 300ms; }
#card .t { display: block; font-size: 17px; line-height: 24px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#card .t.bn { font-family: var(--bangla); }
#count { position: absolute; left: 164px; top: 4px; font-size: 14px; line-height: 20px; color: var(--text-2); opacity: 0; transition: opacity 300ms; }
#count b { font-size: 28px; line-height: 34px; font-weight: 300; color: var(--text); font-variant-numeric: tabular-nums; margin-right: 8px; }
/* the code panel */
#code { position: absolute; left: 732px; top: 0; width: 420px; height: 490px; padding: 2px 0 0 0; border-left: 1px solid var(--border); font-family: var(--mono); font-size: 12px; line-height: 19px; color: var(--text); white-space: pre; }
#code .hd { font-family: var(--sans); font-size: 12px; line-height: 18px; color: var(--helper); padding-left: 18px; margin-bottom: 8px; white-space: normal; }
#code .ln { display: block; padding-left: 16px; border-left: 2px solid transparent; transition: background 300ms, border-color 300ms; }
#code .ln.on { background: var(--blue-10); border-left-color: var(--blue); }
#code .k { color: var(--kw); } #code .f { color: var(--fn); } #code .n { color: var(--nm); } #code .s { color: var(--text-2); }
/* svg text */
.name { font-size: 13px; fill: var(--text-2); }
.name.on { fill: var(--text); font-weight: 600; }
.hdr { font-size: 12px; fill: var(--helper); }
.word { font-family: var(--mono); font-size: 12.5px; fill: var(--text); }
.word.bn { font-family: var(--bangla); font-size: 13.5px; }
.word.sm { font-size: 11px; }
.xv { font-family: var(--mono); font-size: 11px; fill: var(--helper); }
.num { font-family: var(--mono); font-size: 12.5px; fill: var(--text); }
.num.g { fill: var(--helper); font-size: 11px; }
.sc { font-family: var(--mono); font-size: 12.5px; fill: var(--text); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
body.embed { background: var(--bg); }
body.embed #play, body.embed #stepno { display: none; }
body.embed #caption { bottom: 72px; }
body.embed #stage { left: 0; top: 0; transform: none !important; }
</style>
</head>
<body>
<div id="stage">
  <h1 id="title">The weight table</h1>
  <div id="sub"></div>
  <div class="layer">
    <svg id="fig" width="1152" height="490"></svg>
    <div id="card"></div>
    <div id="count"><b>0</b><span></span></div>
    <div id="code"></div>
  </div>
  <div id="caption"></div>
  <button id="play" type="button">Play all</button>
  <div id="stepno"></div>
</div>
<script src="../../theme/d3/d3.min.js"></script>
<script src="c02_lr_scene_data.js"></script>
<script>
(function () {
  'use strict';
  const D = window.LR_SCENE;
  const EMBED = /[?&]embed/.test(location.search);
  if (EMBED) document.body.classList.add('embed');
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let INSTANT = false;
  const T = ms => (REDUCED || INSTANT) ? 0 : ms;
  const EASE = d3.easeCubicInOut, fmt = d3.format(','), f3 = d3.format('+.3f'), p3 = d3.format('.3f');
  const bn = s => /[ঀ-৿]/.test(s);
  const num = t => parseFloat(String(t).replace('−', '-')) || 0;
  const sgn = v => Math.abs(v) < 0.0005 ? '0' : f3(v);
  const stage = document.getElementById('stage');
  const sub = document.getElementById('sub'), cap = document.getElementById('caption'), stepno = document.getElementById('stepno');
  function fit() { if (!EMBED) stage.style.transform = `translate(-50%, -50%) scale(${Math.min(window.innerWidth / 1280, window.innerHeight / 720)})`; }
  window.addEventListener('resize', fit); fit();
  function anim(sel, ms, delay) { if (REDUCED || INSTANT) return shim(sel); return sel.transition().delay(delay || 0).duration(ms).ease(EASE); }
  function shim(sel) {
    const s = { attr(k, v) { sel.attr(k, v); return s; }, style(k, v) { sel.style(k, v); return s; }, text(v) { sel.text(v); return s; },
      attrTween(k, f) { sel.each(function (d, i) { this.setAttribute(k, f.call(this, d, i)(1)); }); return s; },
      tween(k, f) { sel.each(function (d, i) { const g = f.call(this, d, i); if (g) g(1); }); return s; },
      delay() { return s; }, duration() { return s; }, ease() { return s; }, transition() { return s; },
      on(ev, cb) { if (ev === 'end') cb(); return s; }, remove() { sel.remove(); return s; } };
    return s;
  }
  const later = (fn, ms) => (REDUCED || INSTANT) ? fn() : setTimeout(fn, ms);
  const tweenText = (sel, ms, to, f) => { const v0 = num(sel.text()); anim(sel, ms).tween('n', () => u => sel.text(f(v0 + (to - v0) * u))); };

  // ---------- the code panel: cell 13 of the class 1 notebook, shortened, with a light syntax coloring ----------
  const CODE = [
    'def softmax(Z):', '    Z = Z - Z.max(axis=1, keepdims=True)', '    E = np.exp(Z)', '    return E / E.sum(axis=1, keepdims=True)', '',
    'def fit(self, X, y):', '    n, d = X.shape', '    self.W = np.zeros((d, self.K))', '    self.b = np.zeros(self.K)', '    Y = np.eye(self.K)[y]',
    '    for epoch in range(self.epochs):', '        for idx in batches(n):', '            Xb, Yb = X[idx], Y[idx]',
    '            P = softmax(Xb @ self.W + self.b)', '            loss = -np.log(P[range(len(idx)), y[idx]])', '            G = (P - Yb) / len(idx)',
    '            self.W -= self.lr * Xb.T @ G', '            self.b -= self.lr * G.sum(axis=0)', '',
    'def predict_proba(self, X):', '    return softmax(X @ self.W + self.b)'];
  function colorize(line) {
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    return esc(line)
      .replace(/\b(def|for|in|return)\b/g, '<span class="k">$1</span>')
      .replace(/(<span class="k">def<\/span> )(\w+)/g, '$1<span class="f">$2</span>')
      .replace(/\b(self)\b/g, '<span class="s">$1</span>')
      .replace(/\b(\d+)\b/g, '<span class="n">$1</span>');
  }
  const code = d3.select('#code');
  code.append('div').attr('class', 'hd').text('c01_bow_lr.ipynb, cell 13, shortened');
  const lines = code.selectAll('span.ln').data(CODE).join('span').attr('class', 'ln').html(d => d ? colorize(d) : ' ');
  function light(nums) { lines.classed('on', (d, i) => nums.includes(i + 1)); }

  // ---------- geometry ----------
  const K = 6, ROW_Y = 86, ROW_H = 46, CELL_H = 36, X0 = 164, NB = 96;
  const rowY = k => ROW_Y + k * ROW_H;
  const fig = d3.select('#fig');
  const gLit = fig.append('g'), gBand = fig.append('g'), gWin = fig.append('g'), gRows = fig.append('g'), gHdr = fig.append('g'), gCurve = fig.append('g');
  const card = d3.select('#card'), counter = d3.select('#count');
  const bandMax = d3.max(D.band.passes[D.band.passes.length - 1].flat(), v => Math.abs(v));
  const wcol = v => v >= 0 ? '#0F62FE' : '#DA1E28';
  let right = X0 + 4 * 66;                               // the right edge of the word columns; the other columns follow it
  const pos = () => ({ bias: right + 8, z: right + 100, bar: right + 112, pv: right + 166, y: right + 226, gap: right + 288 });

  // the rows: swatch, name, and the per-row figures (bias, z, p bar and value, y, gap), hidden until their step
  const rows = gRows.selectAll('g').data(d3.range(K)).join('g').attr('transform', k => `translate(0, ${rowY(k)})`);
  rows.append('rect').attr('x', 0).attr('y', CELL_H / 2 - 5).attr('width', 10).attr('height', 10).attr('fill', k => D.colors[k]);
  rows.append('text').attr('class', 'name').attr('x', 18).attr('y', CELL_H / 2 + 4).text(k => D.names[k]);
  rows.append('rect').attr('class', 'biasbg').attr('width', 36).attr('height', CELL_H).attr('fill', '#F4F4F4');
  rows.append('text').attr('class', 'sc bias').attr('text-anchor', 'middle').attr('y', CELL_H / 2 + 4).text('0');
  rows.append('text').attr('class', 'sc z').attr('text-anchor', 'end').attr('y', CELL_H / 2 + 4).text('0').style('opacity', 0);
  rows.append('rect').attr('class', 'pbar').attr('y', CELL_H / 2 - 5).attr('height', 10).attr('width', 0).attr('fill', '#C6C6C6');
  rows.append('text').attr('class', 'sc pv').attr('y', CELL_H / 2 + 4).text('').style('opacity', 0);
  rows.append('text').attr('class', 'sc yv').attr('text-anchor', 'middle').attr('y', CELL_H / 2 + 4).text('').style('opacity', 0);
  rows.append('text').attr('class', 'sc gv').attr('text-anchor', 'end').attr('y', CELL_H / 2 + 4).text('').style('opacity', 0);
  gRows.append('line').attr('x1', 0).attr('x2', 716).attr('y1', ROW_Y - 6).attr('y2', ROW_Y - 6).attr('stroke', '#E0E0E0');
  function placeRows() {
    const p = pos();
    rows.select('rect.biasbg').attr('x', p.bias); rows.select('text.bias').attr('x', p.bias + 18);
    rows.select('text.z').attr('x', p.z); rows.select('rect.pbar').attr('x', p.bar); rows.select('text.pv').attr('x', p.pv);
    rows.select('text.yv').attr('x', p.y); rows.select('text.gv').attr('x', p.gap);
    const H = [['bias', p.bias + 18, 'middle'], ['score z', p.z, 'end'], ['p = softmax(z)', p.bar, 'start'], ['target y', p.y, 'middle'], ['p − y', p.gap, 'end']];
    gHdr.selectAll('text.sh').data(H).join('text').attr('class', 'hdr sh').attr('x', d => d[1]).attr('y', ROW_Y - 12).attr('text-anchor', d => d[2]).text(d => d[0]);
  }
  function showHeaders(which) { gHdr.selectAll('text.sh').style('opacity', d => d[0] === 'bias' || which.has(d[0]) ? 1 : 0); }
  function biasTo(vals, ms) { rows.select('text.bias').each(function (k) { tweenText(d3.select(this), ms, vals[k], sgn); }); }

  // the band: the most frequent words as thin columns, every cell shaded by its weight
  function drawBand(pass) {
    const bw = (right - X0) / NB;
    const cells = gBand.selectAll('rect').data(d3.cross(d3.range(K), d3.range(NB)).map(([k, j]) => ({ k, j }))).join('rect')
      .attr('x', d => X0 + d.j * bw + 0.4).attr('y', d => rowY(d.k)).attr('width', bw - 0.8).attr('height', CELL_H);
    setBand(cells, pass);
    gHdr.selectAll('text.bh').data([0]).join('text').attr('class', 'hdr bh').attr('x', X0).attr('y', ROW_Y - 12).text(`the ${NB} most frequent words of ${fmt(D.V)}`);
    return cells;
  }
  function setBand(cells, pass) {
    cells.attr('fill', d => pass < 0 ? '#8D8D8D' : wcol(D.band.passes[pass][d.k][d.j]))
      .attr('fill-opacity', d => pass < 0 ? 0.12 : 0.1 + 0.9 * Math.min(1, Math.abs(D.band.passes[pass][d.k][d.j]) / bandMax));
  }
  // the window: one column per word of the current text
  function drawWindow(cols, vals, wcw, small) {
    right = X0 + cols.length * wcw; placeRows();
    const g = gWin.selectAll('g.col').data(cols, d => d.word).join(
      enter => { const e = enter.append('g').attr('class', 'col').style('opacity', 0);
        e.append('text').attr('class', d => 'word' + (bn(d.word) ? ' bn' : '') + (small ? ' sm' : '')).attr('text-anchor', 'middle').attr('x', wcw / 2).attr('y', ROW_Y - 28).text(d => d.word);
        e.append('text').attr('class', 'xv').attr('text-anchor', 'middle').attr('x', wcw / 2).attr('y', ROW_Y - 12).text(d => `x = ${p3(d.x)}`);
        const c = e.selectAll('g.cell').data(d => d3.range(K).map(k => ({ k, word: d.word }))).join('g').attr('class', 'cell').attr('transform', d => `translate(0, ${rowY(d.k)})`);
        c.append('rect').attr('class', 'bar').attr('y', CELL_H - 8).attr('height', 3).attr('x', wcw / 2).attr('width', 0);
        c.append('text').attr('class', 'num').attr('text-anchor', 'middle').attr('x', wcw / 2).attr('y', 18).text('0');
        c.append('text').attr('class', 'num g').attr('text-anchor', 'middle').attr('x', wcw / 2).attr('y', 31).text('').style('opacity', 0);
        return e; },
      update => update, exit => { anim(exit, 300).style('opacity', 0).remove(); return exit; });
    g.attr('transform', (d, i) => `translate(${X0 + i * wcw}, 0)`);
    anim(g, 300).style('opacity', 1);
    const strips = gLit.selectAll('rect').data(cols, d => d.word).join('rect').attr('x', (d, i) => X0 + i * wcw + 2).attr('y', ROW_Y - 2).attr('width', wcw - 4).attr('height', (K - 1) * ROW_H + CELL_H + 4).attr('fill', '#EDF5FF').style('opacity', 0);
    anim(strips, 400, 300).style('opacity', 1);
    setCells(g, vals, 0, wcw);
  }
  function setCells(g, vals, ms, wcw) {
    const s = Math.max(0.05, d3.max(g.data(), d => d3.max(d3.range(K), k => Math.abs(vals(d.word, k)))) || 0.05);
    g.selectAll('g.cell').each(function (d) {
      const v = vals(d.word, d.k), c = d3.select(this), w = Math.min(1, Math.abs(v) / s) * (wcw / 2 - 8);
      tweenText(c.select('text.num'), ms, v, sgn);
      anim(c.select('rect.bar'), ms).attr('x', v >= 0 ? wcw / 2 : wcw / 2 - w).attr('width', w).attr('fill', wcol(v));
    });
  }
  // the per-row figures: scores, probabilities, target, gap; show: a Set of 'z' 'p' 'y' 'gap' 'loss'
  function drawScores(st, show, ms) {
    const pmax = d3.max(st.p);
    rows.each(function (k) {
      const g = d3.select(this), on = k === st.k;
      if (show.has('z')) { g.select('text.z').style('opacity', 1); tweenText(g.select('text.z'), ms, st.z[k], sgn); }
      const bw = show.has('p') ? 50 * st.p[k] / pmax : 0;
      anim(g.select('rect.pbar'), ms).attr('width', bw).attr('fill', on && show.has('y') ? D.colors[k] : '#C6C6C6');
      if (show.has('p')) { g.select('text.pv').style('opacity', 1); tweenText(g.select('text.pv'), ms, st.p[k], p3); }
      const fitY = pos().y <= 700, fitG = pos().gap <= 716;
      g.select('text.yv').text(on ? '1' : '0').style('font-weight', on ? 600 : 400).style('opacity', show.has('y') && fitY ? 1 : 0);
      g.select('text.gv').text(f3(st.p[k] - (on ? 1 : 0))).attr('fill', on ? '#0F62FE' : '#DA1E28').style('opacity', show.has('gap') && fitG ? 1 : 0);
      g.select('text.name').classed('on', on && show.has('y'));
    });
    showHeaders(new Set([show.has('z') && 'score z', show.has('p') && 'p = softmax(z)', show.has('y') && pos().y <= 700 && 'target y', show.has('gap') && pos().gap <= 716 && 'p \u2212 y'].filter(Boolean)));
    card.select('.loss').text(`loss = −log₂ ${p3(st.p[st.k])} = ${p3(st.loss)} bits`).style('opacity', show.has('loss') ? 1 : 0);
  }
  function clearScores() {
    rows.select('text.z').style('opacity', 0).text('0'); rows.select('rect.pbar').attr('width', 0); rows.select('text.pv').style('opacity', 0).text('');
    rows.select('text.yv').style('opacity', 0); rows.select('text.gv').style('opacity', 0); rows.select('text.name').classed('on', false);
    showHeaders(new Set());
  }
  function showCard(title, text, color) { card.html(`<small><span>${title}</span><span class="loss"></span></small><span class="t ${bn(text) ? 'bn' : ''}">${text}</span>`).style('border-left-color', color).style('opacity', 1); }

  const SUBS = ['',
    `Six topics, ${fmt(D.V)} words: a weight for each pair, and a bias per topic. All start at 0.`,
    'One training text. Along each row, add weight × x for its words, plus the bias: six scores.',
    'Softmax turns the six scores into six probabilities.',
    'The target: 1 for the true topic, 0 for the rest. The loss is −log₂ p of the true topic.',
    'The gap p − y: negative means move toward this text, positive means move away.',
    'The update: each cell in the text’s columns moves by −step × x × gap.',
    'Two more texts, the same four steps: scores, softmax, loss, update.',
    `All ${fmt(D.articles)} texts, ${D.epochs} times. The weights change and the loss decreases.`,
    'Inference: the trained table and one sentence. The same sum, the same softmax.',
    'Under each weight, the count table’s ratio for the same word.'];
  const CAPS = ['',
    'The vocabulary: words seen at least twice in the 40,000 training texts.',
    'x is the text’s TF-IDF vector, of length 1; four of its words are shown.',
    '',
    'log₂ 6 = 2.585 bits: the cost of an even guess.',
    'The gap is also the gradient of the loss with respect to the score; class 5 shows why.',
    `step = ${D.step.toFixed(3)}: the learning rate ${D.lr} divided by the number of texts in a batch.`,
    'Real training texts. A word shared with the first text already pushes the second one a little toward the first text’s topic.',
    'The training loss per pass in bits, and the weights after each pass.',
    'The trained weights; wickets was seen once, so it is not in the vocabulary. The model predicts international; the true topic is sports.',
    'The count table’s p(word | topic) is the plain ratio of the count matrix: a count only increases and does not depend on the model’s mistakes.'];
  const steps = {};
  const ST = D.steps, NCOL = 4;
  const stepVals = (st, after) => (w, k) => { const c = st.cols.find(c => c.word === w); return c ? (after ? c.after : c.before)[k] : 0; };

  steps[1] = () => {
    light([8, 9]);
    right = X0 + NCOL * 66; placeRows(); showHeaders(new Set());
    drawBand(-1); biasTo([0, 0, 0, 0, 0, 0], 0);
    gWin.selectAll('*').remove(); gLit.selectAll('*').remove(); gCurve.selectAll('*').remove(); clearScores();
    card.style('opacity', 0); counter.style('opacity', 0);
  };
  steps[2] = () => {
    light([14]);
    const st = ST[0];
    showCard(`training text 1 · ${D.names[st.k]}`, st.text, D.colors[st.k]);
    anim(gBand.selectAll('rect'), 400).style('opacity', 0).remove(); gHdr.selectAll('text.bh').remove();
    drawWindow(st.cols.slice(0, NCOL), stepVals(st, false), 66);
    later(() => drawScores(st, new Set(['z']), 600), 600);
  };
  steps[3] = () => { light([1, 2, 3, 4, 14]); drawScores(ST[0], new Set(['z', 'p']), 700); };
  steps[4] = () => { light([10, 15]); drawScores(ST[0], new Set(['z', 'p', 'y', 'loss']), 400); };
  steps[5] = () => { light([16]); drawScores(ST[0], new Set(['z', 'p', 'y', 'loss', 'gap']), 400); };
  steps[6] = () => { light([17, 18]); setCells(gWin.selectAll('g.col'), stepVals(ST[0], true), 900, 66); biasTo(ST[0].b_after, 900); };
  steps[7] = () => {
    const run = (st, n, t0) => {
      later(() => { light([13, 14]); showCard(`training text ${n} · ${D.names[st.k]}`, st.text, D.colors[st.k]); clearScores(); drawWindow(st.cols.slice(0, NCOL), stepVals(st, false), 66); drawScores(st, new Set(['z']), 500); }, t0);
      later(() => { light([14]); drawScores(st, new Set(['z', 'p']), 500); }, t0 + 900);
      later(() => { light([15, 16]); drawScores(st, new Set(['z', 'p', 'y', 'loss', 'gap']), 400); }, t0 + 1700);
      later(() => { light([17, 18]); setCells(gWin.selectAll('g.col'), stepVals(st, true), 800, 66); biasTo(st.b_after, 800); }, t0 + 2500);
    };
    run(ST[1], 2, 0); run(ST[2], 3, 3900);
  };
  steps[8] = () => {
    light([11, 12]);
    anim(gWin.selectAll('g.col'), 400).style('opacity', 0).remove(); anim(gLit.selectAll('rect'), 400).style('opacity', 0).remove();
    clearScores(); card.style('opacity', 0);
    counter.style('opacity', 1); counter.select('b').text('0'); counter.select('span').text(`texts read · pass 1 of ${D.epochs}`);
    right = X0 + NCOL * 66; placeRows();
    const cells = drawBand(-1);
    const cy0 = ROW_Y + K * ROW_H + 10, cx = d3.scaleLinear().domain([0, D.epochs]).range([X0, 700]), cy = d3.scaleLinear().domain([0, 2.7]).range([cy0 + 100, cy0 + 4]);
    gCurve.append('text').attr('class', 'hdr').attr('x', 700).attr('y', cy0 + 4).attr('text-anchor', 'end').text('training loss, bits per text, after each pass');
    [0, 1, 2].forEach(v => { gCurve.append('line').attr('x1', X0).attr('x2', 700).attr('y1', cy(v)).attr('y2', cy(v)).attr('stroke', '#E0E0E0'); gCurve.append('text').attr('class', 'hdr').attr('x', X0 - 8).attr('y', cy(v) + 4).attr('text-anchor', 'end').text(v); });
    const pts = [[0, Math.log2(6)]].concat(D.curve.map((v, i) => [i + 1, v]));
    const path = gCurve.append('path').attr('fill', 'none').attr('stroke', '#0F62FE').attr('stroke-width', 2).attr('d', d3.line().x(d => cx(d[0])).y(d => cy(d[1]))(pts));
    const L = path.node().getTotalLength(); path.attr('stroke-dasharray', L).attr('stroke-dashoffset', L);
    const tot = T(6500);
    anim(path, tot).ease(d3.easeLinear).attr('stroke-dashoffset', 0);
    gCurve.append('text').attr('class', 'num').attr('x', cx(0) + 8).attr('y', cy(Math.log2(6)) + 4).text('2.585');
    const endv = gCurve.append('text').attr('class', 'num').attr('x', cx(D.epochs) + 6).attr('y', cy(D.curve[D.epochs - 1]) + 4).text(p3(D.curve[D.epochs - 1])).style('opacity', 0);
    anim(endv, 300, tot).style('opacity', 1);
    const c = counter.select('b');
    anim(c, tot).ease(d3.easeLinear).tween('n', () => u => c.text(fmt(Math.round(D.articles * D.epochs * u))));
    D.band.passes.forEach((snap, i) => later(() => { setBand(REDUCED || INSTANT ? cells : cells.transition().duration(380), i); counter.select('span').text(`texts read · pass ${i + 1} of ${D.epochs}`); }, Math.max(0, tot / D.epochs * (i + 1) - 380)));
    later(() => biasTo(D.infer.bias, 800), 200);
  };
  steps[9] = () => {
    light([20, 21]);
    counter.style('opacity', 0); gCurve.selectAll('*').remove();
    anim(gBand.selectAll('rect'), 400).style('opacity', 0).remove(); gHdr.selectAll('text.bh').remove();
    const inf = D.infer, inv = inf.pushes.filter(p => p.inVocab);
    showCard('a new sentence \u00b7 wickets is not in the vocabulary', inf.text, '#0F62FE');
    drawWindow(inv.map(p => ({ word: p.word, x: p.x })), (w, k) => { const p = inv.find(p => p.word === w); return p ? p.w[k] : 0; }, 68, true);
    const st = { z: inf.z, p: inf.p, k: D.labels.indexOf(inf.label), loss: inf.loss };
    later(() => drawScores(st, new Set(['z']), 600), 700);
    later(() => drawScores(st, new Set(['z', 'p']), 600), 1600);
    later(() => drawScores(st, new Set(['z', 'p', 'y', 'loss']), 400), 2500);
  };
  steps[10] = () => {
    light([]);
    gWin.selectAll('g.col').selectAll('g.cell').each(function (d) {
      const c = D.compare.find(c => c.word === d.word); if (!c) return;
      const cell = d3.select(this);
      anim(cell.select('rect.bar'), 300).style('opacity', 0);
      anim(cell.select('text.num.g').text(d3.format('.6f')(c.p[d.k])), 400, 60 * d.k).style('opacity', 1);
    });
  };

  // ---------- navigation ----------
  let step = 0; const LAST = 10;
  function reset() {
    d3.selectAll('#stage *').interrupt();
    gBand.selectAll('*').remove(); gWin.selectAll('*').remove(); gLit.selectAll('*').remove(); gCurve.selectAll('*').remove(); gHdr.selectAll('text.bh').remove();
    clearScores(); rows.select('text.bias').text('0');
    card.style('opacity', 0).html(''); counter.style('opacity', 0); light([]);
  }
  function goTo(n) {
    n = Math.max(1, Math.min(LAST, n)); reset();
    stage.classList.add('instant'); INSTANT = true;
    for (let k = 1; k < n; k++) steps[k]();
    INSTANT = false; requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove('instant')));
    step = n; sub.innerHTML = SUBS[n]; cap.textContent = CAPS[n]; stepno.textContent = `${n} / ${LAST}`;
    steps[n]();
  }
  if (!EMBED) {
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); if (step < LAST) goTo(step + 1); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); if (step > 1) goTo(step - 1); }
      else if (e.key === 'p' || e.key === 'P') playAll();
    });
    stage.addEventListener('click', e => { if (e.target.id !== 'play' && step < LAST) goTo(step + 1); });
  }
  const PAUSE = [0, 3000, 3500, 2500, 2500, 2500, 3000, 8500, 8500, 5000, 3000];
  let playTimer = null;
  function playAll() { if (playTimer) clearTimeout(playTimer); let n = 1; goTo(1); const next = () => { n++; if (n > LAST) { playTimer = null; return; } goTo(n); playTimer = setTimeout(next, PAUSE[n]); }; playTimer = setTimeout(next, PAUSE[1]); }
  document.getElementById('play').addEventListener('click', playAll);
  window.lrGoTo = goTo;
  window.addEventListener('message', e => { const d = e.data; if (d && d.scene === 'lr' && typeof d.goTo === 'number') goTo(d.goTo); });
  if (EMBED && window.parent !== window) window.parent.postMessage({ scene: 'lr', ready: true }, '*');
  goTo(1);
})();
</script>
