<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The count matrix</title>
<!-- Standalone scene for class 2: how Naive Bayes works on the real corpus. Eight steps, one key press each
     (→ or click: next, ←: back, P: play all). Data: c02_nb_scene_data.js, built by c02_nb_scene_build.py from
     the class 1 notebook. D3 from the theme; the Carbon tokens of theme/tokens.json; the deck's 1280 x 720 canvas,
     so the scene drops into the deck in an iframe with ?embed (the deck's fragments call window.nbGoTo). -->
<style>
@font-face { font-family: "IBM Plex Sans"; font-weight: 300; font-display: block; src: local("IBM Plex Sans Light"), url("../../theme/fonts/IBMPlexSans-Light.otf") format("opentype"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 400; font-display: block; src: local("IBM Plex Sans"), url("../../theme/fonts/IBMPlexSans-Regular.otf") format("opentype"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 600; font-display: block; src: local("IBM Plex Sans SemiBold"), url("../../theme/fonts/IBMPlexSans-SemiBold.otf") format("opentype"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-display: block; src: local("IBM Plex Mono"), url("../../theme/fonts/IBMPlexMono-Regular.otf") format("opentype"); }
:root {
  --bg: #FFFFFF; --layer: #F4F4F4; --border: #E0E0E0; --border-strong: #8D8D8D;
  --text: #161616; --text-2: #525252; --helper: #6F6F6F; --placeholder: #A8A8A8;
  --blue: #0F62FE; --blue-20: #D0E2FF; --blue-10: #EDF5FF; --quiet: #C6C6C6;
  --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif; --mono: "IBM Plex Mono", Menlo, monospace;
  --bangla: "Kohinoor Bangla", "Noto Sans Bengali", "Bangla Sangam MN", sans-serif;
  --ease: cubic-bezier(0.4, 0.14, 0.3, 1);
}
html, body { margin: 0; height: 100%; background: #262626; overflow: hidden; }
body { position: relative; font-family: var(--sans); color: var(--text); }
#stage { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; background: var(--bg); overflow: hidden; transform-origin: center; }
#stage * { box-sizing: border-box; }
#stage.instant *, #stage.instant *::before, #stage.instant *::after { transition: none !important; }
#title { position: absolute; left: 64px; top: 44px; margin: 0; font-size: 42px; line-height: 50px; font-weight: 300; }
#sub { position: absolute; left: 64px; top: 102px; width: 1152px; font-size: 20px; line-height: 28px; color: var(--text-2); }
#sub b { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
#caption { position: absolute; left: 64px; bottom: 28px; width: 880px; font-size: 14px; line-height: 20px; color: var(--helper); }
#stepno { position: absolute; right: 64px; bottom: 28px; font-size: 14px; line-height: 20px; color: var(--placeholder); font-variant-numeric: tabular-nums; }
#play { position: absolute; right: 124px; bottom: 24px; font: 14px/20px var(--sans); color: var(--helper); background: none; border: 1px solid var(--border); padding: 3px 10px; cursor: pointer; }
.layer { position: absolute; left: 64px; top: 150px; width: 1152px; height: 490px; }
#fig { position: absolute; left: 0; top: 0; }
/* the article card: a training article while counting, the new article from step 5 */
#card { position: absolute; left: 212px; top: 0; width: 760px; height: 62px; padding: 7px 14px; white-space: nowrap; overflow: hidden; background: var(--layer); border-left: 3px solid var(--border-strong); font-size: 18px; line-height: 26px; opacity: 0; transition: opacity 300ms var(--ease), border-color 300ms; }
#card small { display: block; font-size: 13px; line-height: 18px; color: var(--helper); }
#card .bn { font-family: var(--bangla); }
#verdict { position: absolute; left: 990px; top: 6px; width: 162px; font-size: 13px; line-height: 18px; color: var(--helper); opacity: 0; transition: opacity 400ms; }
#verdict b { display: block; font-size: 17px; line-height: 22px; font-weight: 600; color: var(--text); }
#count { position: absolute; left: 990px; top: 6px; width: 162px; font-size: 15px; line-height: 20px; color: var(--text-2); opacity: 0; transition: opacity 300ms; }
#count b { display: block; font-size: 28px; line-height: 34px; font-weight: 300; color: var(--text); font-variant-numeric: tabular-nums; }
.row-name { font-size: 15px; fill: var(--text-2); }
.hdr { font-size: 14px; fill: var(--helper); }
.word { font-family: var(--mono); font-size: 14px; fill: var(--text); }
.word.bn { font-family: var(--bangla); font-size: 15px; }
.cell-num { font-family: var(--mono); font-size: 12px; fill: var(--text); }
.tot { font-family: var(--mono); font-size: 14px; fill: var(--text-2); }
.chip { font-family: var(--mono); font-size: 13px; fill: var(--text); }
.chip.bn { font-family: var(--bangla); font-size: 14px; }
.plus { font-family: var(--mono); font-size: 12px; fill: var(--blue); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
body.embed { background: var(--bg); }
body.embed #play, body.embed #stepno { display: none; }
body.embed #caption { bottom: 72px; }
body.embed #stage { left: 0; top: 0; transform: none !important; }
</style>
</head>
<body>
<div id="stage">
  <h1 id="title">The count matrix</h1>
  <div id="sub"></div>
  <div class="layer">
    <svg id="fig" width="1152" height="490"></svg>
    <div id="card"></div>
    <div id="count"><b>0</b>articles read</div>
  <div id="verdict"></div>
  </div>
  <div id="caption"></div>
  <button id="play" type="button">Play all</button>
  <div id="stepno"></div>
</div>
<script src="../../theme/d3/d3.min.js"></script>
<script src="c02_nb_scene_data.js"></script>
<script>
(function () {
  'use strict';
  const D = window.NB_SCENE;
  const EMBED = /[?&]embed/.test(location.search);
  if (EMBED) document.body.classList.add('embed');
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let INSTANT = false;
  const T = ms => (REDUCED || INSTANT) ? 0 : ms;
  const EASE = d3.easeCubicInOut, fmt = d3.format(','), bn = s => /[ঀ-৿]/.test(s);
  const stage = document.getElementById('stage');
  const sub = document.getElementById('sub'), cap = document.getElementById('caption'), stepno = document.getElementById('stepno');
  function fit() { if (!EMBED) stage.style.transform = `translate(-50%, -50%) scale(${Math.min(window.innerWidth / 1280, window.innerHeight / 720)})`; }
  window.addEventListener('resize', fit); fit();
  function anim(sel, ms, delay) { if (REDUCED || INSTANT) return shim(sel); return sel.transition().delay(delay || 0).duration(ms).ease(EASE); }
  function shim(sel) {
    const s = { attr(k, v) { sel.attr(k, v); return s; }, style(k, v) { sel.style(k, v); return s; }, text(v) { sel.text(v); return s; },
      attrTween(k, f) { sel.each(function (d, i) { this.setAttribute(k, f.call(this, d, i)(1)); }); return s; },
      tween(k, f) { sel.each(function (d, i) { const g = f.call(this, d, i); if (g) g(1); }); return s; },
      delay() { return s; }, duration() { return s; }, ease() { return s; }, transition() { return s; },
      on(ev, cb) { if (ev === 'end') cb(); return s; }, remove() { sel.remove(); return s; } };
    return s;
  }
  const later = (fn, ms) => (REDUCED || INSTANT) ? fn() : setTimeout(fn, ms);

  // ---------- geometry ----------
  const K = 6, ROW_Y = 92, ROW_H = 50, CELL_H = 40, X0 = 212, BAND_W = 768, NB = 120, BW = BAND_W / NB;
  const WIN = D.window, WX = 212, TOT_X = 990, WCW = Math.floor((TOT_X - 26 - WX) / D.window.length);
  const rowY = k => ROW_Y + k * ROW_H, bandX = j => X0 + j * BW;
  const fig = d3.select('#fig');
  const gRows = fig.append('g'), gBand = fig.append('g'), gWin = fig.append('g'), gTot = fig.append('g'), gFly = fig.append('g'), gHdr = fig.append('g');
  const card = d3.select('#card'), counter = d3.select('#count');
  const colmax = d3.range(NB).map(j => Math.max(1, d3.max(D.band.counts, r => r[j])));
  const sci = v => { if (v <= 0) return '0'; const e = Math.floor(Math.log10(v)), m = v / 10 ** e; return `${m.toFixed(1)} × 10<tspan dy="-7" font-size="10">${e}</tspan>`; };

  // rows: swatch and name, once
  const rows = gRows.selectAll('g').data(d3.range(K)).join('g').attr('transform', k => `translate(0, ${rowY(k)})`);
  rows.append('rect').attr('x', 0).attr('y', CELL_H / 2 - 6).attr('width', 12).attr('height', 12).attr('fill', k => D.colors[k]);
  rows.append('text').attr('class', 'row-name').attr('x', 22).attr('y', CELL_H / 2 + 5).text(k => D.names[k]);
  gRows.append('line').attr('x1', 0).attr('x2', 1152).attr('y1', ROW_Y - 6).attr('y2', ROW_Y - 6).attr('stroke', '#E0E0E0');

  function drawBand(final) {                             // the 120 most frequent words as thin columns
    const cells = gBand.selectAll('rect').data(d3.cross(d3.range(K), d3.range(NB)).map(([k, j]) => ({ k, j }))).join('rect')
      .attr('x', d => bandX(d.j) + 0.6).attr('y', d => rowY(d.k)).attr('width', BW - 1.2).attr('height', CELL_H)
      .attr('fill', d => D.colors[d.k]).attr('fill-opacity', d => final ? 0.12 + 0.88 * D.band.counts[d.k][d.j] / colmax[d.j] : 0.08);
    gHdr.selectAll('text.hdr').data([0]).join('text').attr('class', 'hdr').attr('x', X0).attr('y', ROW_Y - 14).text('one column per word: the 120 most frequent, then 111,321 more');
    gHdr.selectAll('text.more').data([0]).join('text').attr('class', 'hdr more').attr('x', X0 + BAND_W + 10).attr('y', rowY(2) + 30).text('…');
    gTot.selectAll('text.hdr').data([0]).join('text').attr('class', 'hdr').attr('x', 1152).attr('text-anchor', 'end').attr('y', ROW_Y - 14).text('words in the row');
    return cells;
  }

  const SUBS = ['',
    'Six rows, one per topic. <b>111,441</b> columns, one per word. Every cell starts at 0.',
    'Read every training article: for each word, add 1 in the row of its topic.',
    `${WIN.length} of the columns, with their counts.`,
    'Divide each row by its total: p(word | topic).',
    'A new article. Its words pick the columns.',
    'Multiply along each row: p(text | topic).',
    'Times p(topic), divided by the sum: p(topic | text).',
    'The topic with the largest probability is selected.'];
  const CAPS = ['',
    '',
    'Three real training articles, then the rest at speed. Column shading: the share of the column’s count that each topic holds.',
    'Real counts. The three words of the toy table, then the eight words of the next article.',
    'p = count ÷ words in the row. A word never seen in a topic gets 0. Bars are scaled within each column.',
    'A dev article, its first eight words.',
    'Products of seven probabilities, in scientific notation. One 0 makes the whole product 0.',
    'Bayes’ rule, computed in logs as softmax.',
    'A word unseen in a topic rules that topic out. Class 3 softens this with smoothing.'];
  const steps = {};

  steps[1] = () => {
    drawBand(false);
    gTot.selectAll('text.tot').data(d3.range(K)).join('text').attr('class', 'tot').attr('x', TOT_X).attr('y', k => rowY(k) + CELL_H / 2 + 5).text('0');
    card.style('opacity', 0); counter.style('opacity', 0);
  };

  steps[2] = () => {
    counter.style('opacity', 1); counter.select('b').text('0');
    const S = D.samples;
    let t0 = 0;
    S.forEach((s, si) => {
      const k = D.labels.indexOf(s.label);
      later(() => {
        card.html(`<small>training article, ${D.names[k]}</small><span class="${bn(s.text) ? 'bn' : ''}">${s.text}</span>`)
          .style('border-left-color', D.colors[k]).style('opacity', 1);
        counter.select('b').text(fmt(si + 1));
        rows.filter(kk => kk === k).select('text').style('font-weight', 600).style('fill', '#161616');
        s.tokens.forEach((w, i) => {
          later(() => {
            const r = s.ranks[i], x = r >= 0 ? bandX(r) + BW / 2 : X0 + BAND_W + 14;
            const chip = gFly.append('text').attr('class', 'chip' + (bn(w) ? ' bn' : '')).attr('text-anchor', 'middle').attr('x', 300 + i * 90).attr('y', 36).text(w).style('opacity', 0);
            anim(chip, 200).style('opacity', 1);
            anim(chip, 550, 250).attr('x', x).attr('y', rowY(k) + 26).style('opacity', 0.0).remove();
            const cell = gBand.selectAll('rect').filter(d => d.k === k && d.j === r);
            if (r >= 0) { anim(cell, 150, 750).attr('fill-opacity', 0.95); anim(cell, 400, 950).attr('fill-opacity', 0.35); }
            const plus = gFly.append('text').attr('class', 'plus').attr('text-anchor', 'middle').attr('x', x).attr('y', rowY(k) - 4).text('+1').style('opacity', 0);
            anim(plus, 200, 750).style('opacity', 1); anim(plus, 400, 1000).attr('y', rowY(k) - 18).style('opacity', 0).remove();
          }, 160 * i);
        });
        later(() => rows.filter(kk => kk === k).select('text').style('font-weight', null).style('fill', null), 160 * s.tokens.length + 1200);
      }, t0);
      t0 += 160 * s.tokens.length + 1500;
    });
    later(() => {                                        // and the rest, at speed
      card.html(`<small>training articles</small>… and ${fmt(D.articles - S.length)} more`).style('border-left-color', '#8D8D8D').style('opacity', 1);
      const c = counter.select('b');
      anim(c, 2600).tween('n', () => t => c.text(fmt(Math.round(S.length + (D.articles - S.length) * t))));
      gBand.selectAll('rect').each(function (d) { anim(d3.select(this), 2600).attr('fill-opacity', 0.12 + 0.88 * D.band.counts[d.k][d.j] / colmax[d.j]); });
      gTot.selectAll('text.tot').each(function (k) { const s = d3.select(this); anim(s, 2600).tween('n', () => t => s.text(fmt(Math.round(D.N[k] * t)))); });
    }, t0);
  };

  steps[3] = () => {
    anim(gBand.selectAll('rect'), 500).style('opacity', 0).remove();
    gHdr.selectAll('text.more').remove();
    anim(card, 300).style('opacity', 0); anim(counter, 300).style('opacity', 0);
    gHdr.selectAll('text.hdr').text(`${WIN.length} of the 111,441 columns`).attr('y', ROW_Y - 40);
    const g = gWin.selectAll('g.col').data(WIN).join('g').attr('class', 'col').attr('transform', (d, i) => `translate(${WX + i * WCW}, 0)`);
    g.append('text').attr('class', d => 'word' + (bn(d.word) ? ' bn' : '')).attr('text-anchor', 'middle').attr('x', WCW / 2).attr('y', ROW_Y - 14).text(d => d.word).style('opacity', 0);
    g.each(function (d, i) { anim(d3.select(this).select('text'), 300, 200 + 60 * i).style('opacity', 1); });
    const cells = g.selectAll('g.cell').data(d => d.counts.map((c, k) => ({ c, k, p: d.p[k], col: d }))).join('g').attr('class', 'cell').attr('transform', d => `translate(0, ${rowY(d.k)})`);
    cells.append('rect').attr('class', 'bg').attr('x', 2).attr('y', 0).attr('width', WCW - 4).attr('height', CELL_H).attr('fill', '#F4F4F4');
    cells.append('rect').attr('class', 'bar').attr('x', 2).attr('y', CELL_H - 4).attr('width', 0).attr('height', 4).attr('fill', d => D.colors[d.k]);
    const nums = cells.append('text').attr('class', 'cell-num').attr('text-anchor', 'end').attr('x', WCW - 8).attr('y', CELL_H / 2 + 5).text('0');
    nums.each(function (d) { const s = d3.select(this); anim(s, 900, 400 + 60 * WIN.indexOf(d.col)).tween('n', () => t => s.text(fmt(Math.round(d.c * t)))); });
  };

  steps[4] = () => {
    gTot.selectAll('text.hdr').text('÷ words in the row');
    const cells = gWin.selectAll('g.cell');
    cells.select('text').each(function (d) { const s = d3.select(this); anim(s, 700, 80 * d.k).tween('n', () => t => s.text(t < 0.5 ? fmt(d.c) : d.p.toFixed(6))); });
    cells.select('rect.bar').each(function (d) { const m = d3.max(d.col.p); anim(d3.select(this), 700, 400 + 80 * d.k).attr('width', (WCW - 4) * d.p / m); });
  };

  steps[5] = () => {
    const n = D.new;
    gHdr.selectAll('text.hdr').remove();
    card.html(`<small>a new article</small><span class="${bn(n.text) ? 'bn' : ''}">${n.text}</span>`)
      .style('border-left-color', '#0F62FE').style('opacity', 1);
    const used = new Set(n.tokens);
    gWin.selectAll('g.col').each(function (d, i) {
      const g = d3.select(this), on = used.has(d.word);
      anim(g.select('text.word'), 400, 300 + 50 * i).style('fill', on ? '#0F62FE' : '#A8A8A8').style('font-weight', on ? 600 : 400);
      anim(g.selectAll('rect.bg'), 400, 300 + 50 * i).attr('fill', on ? '#EDF5FF' : '#F4F4F4');
      anim(g.selectAll('.cell'), 400, 300 + 50 * i).style('opacity', on ? 1 : 0.35);
    });
  };

  steps[6] = () => {
    const n = D.new, used = n.tokens;
    gTot.selectAll('text.hdr').text('p(text | topic)');
    gTot.selectAll('text.tot').text('');
    d3.range(K).forEach(k => {
      later(() => {
        let acc = 1;
        n.per_word.forEach((pw, i) => {
          later(() => {
            const col = gWin.selectAll('g.col').filter(d => d.word === pw.word);
            const cell = col.selectAll('g.cell').filter(d => d.k === k).select('rect.bg');
            anim(cell, 120).attr('fill', '#D0E2FF'); anim(cell, 300, 160).attr('fill', '#EDF5FF');
            acc *= pw.p[k];
            gTot.selectAll('text.tot').filter(kk => kk === k).html(sci(acc)).style('opacity', 1);
          }, 110 * i);
        });
      }, 300 + 1000 * k);
    });
  };

  steps[7] = () => {
    gTot.selectAll('text.hdr').text('p(topic | text)');
    const post = D.new.post;
    gTot.selectAll('text.tot').each(function (k) {
      const s = d3.select(this);
      anim(s, 300, 100 * k).style('opacity', 0).on('end', () => { s.text(post[k] < 0.0005 ? '< 0.001' : post[k].toFixed(3)).attr('x', TOT_X + 80); anim(s, 300).style('opacity', 1); });
    });
    const bars = gTot.selectAll('rect.post').data(d3.range(K)).join('rect').attr('class', 'post').attr('x', TOT_X).attr('y', k => rowY(k) + 12).attr('height', 16).attr('width', 0).attr('fill', k => D.colors[k]);
    bars.each(function (k) { anim(d3.select(this), 600, 500 + 100 * k).attr('width', Math.max(1, 70 * post[k])); });
  };

  steps[8] = () => {
    const k = D.new.post.indexOf(d3.max(D.new.post));
    gTot.selectAll('text.hdr').remove();
    anim(gRows.selectAll('g'), 400).style('opacity', kk => kk === k ? 1 : 0.4);
    anim(gTot.selectAll('text.tot'), 400).style('opacity', kk => kk === k ? 1 : 0.4).style('font-weight', kk => kk === k ? 600 : 400);
    anim(gTot.selectAll('rect.post'), 400).style('opacity', kk => kk === k ? 1 : 0.4);
    anim(gWin.selectAll('g.cell'), 400).style('opacity', function (d) { return d.k === k ? 1 : 0.25; });
    d3.select('#verdict').html(`Naive Bayes says<b>${D.names[k]}</b>true label: ${D.names[D.labels.indexOf(D.new.label)]}`).style('opacity', 1);
  };

  // ---------- navigation ----------
  let step = 0; const LAST = 8;
  function reset() {
    d3.selectAll('#stage *').interrupt();
    gBand.selectAll('*').remove(); gWin.selectAll('*').remove(); gTot.selectAll('*').remove(); gFly.selectAll('*').remove(); gHdr.selectAll('*').remove();
    gRows.selectAll('g').style('opacity', null).select('text').style('font-weight', null).style('fill', null);
    card.style('opacity', 0).html(''); counter.style('opacity', 0); d3.select('#verdict').style('opacity', 0);
  }
  function goTo(n) {
    n = Math.max(1, Math.min(LAST, n)); reset();
    stage.classList.add('instant'); INSTANT = true;
    for (let k = 1; k < n; k++) steps[k]();
    INSTANT = false; requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove('instant')));
    step = n; sub.innerHTML = SUBS[n]; cap.textContent = CAPS[n]; stepno.textContent = `${n} / ${LAST}`;
    steps[n]();
  }
  if (!EMBED) {
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); if (step < LAST) goTo(step + 1); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); if (step > 1) goTo(step - 1); }
      else if (e.key === 'p' || e.key === 'P') playAll();
    });
    stage.addEventListener('click', e => { if (e.target.id !== 'play' && step < LAST) goTo(step + 1); });
  }
  const PAUSE = [0, 3000, 11000, 3500, 3000, 2500, 7500, 2500, 3000];
  let playTimer = null;
  function playAll() { if (playTimer) clearTimeout(playTimer); let n = 1; goTo(1); const next = () => { n++; if (n > LAST) { playTimer = null; return; } goTo(n); playTimer = setTimeout(next, PAUSE[n]); }; playTimer = setTimeout(next, PAUSE[1]); }
  document.getElementById('play').addEventListener('click', playAll);
  window.nbGoTo = goTo;
  // the deck drives the scene by message (a direct call is blocked between file:// documents)
  window.addEventListener('message', e => { const d = e.data; if (d && d.scene === 'nb' && typeof d.goTo === 'number') goTo(d.goTo); });
  if (EMBED && window.parent !== window) window.parent.postMessage({ scene: 'nb', ready: true }, '*');
  goTo(1);
})();
</script>
</body>
</html>
